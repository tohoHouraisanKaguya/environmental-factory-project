<text x="560" y="341.5" text-anchor="middle" font-size="21" font-weight="400" fill="#000000">总有效容积63000 m³</text>
<text x="560" y="368.5" text-anchor="middle" font-size="21" font-weight="400" fill="#000000">SRT 20 d</text>
