<text x="220" y="598" text-anchor="middle" font-size="19" font-weight="400" fill="#000000">以有效氯计5 mg/L</text>
<text x="220" y="629" text-anchor="middle" font-size="19" font-weight="400" fill="#000000">唯一消毒剂→接触池</text>
<text x="800" y="700" text-anchor="middle" font-size="21" font-weight="700" fill="#000000">生物固体库存220500 kg；20 d泥龄对应排固11025 kg/d；峰时生物SLR=118.471 kg/(m²·d)。</text>
<line x1="55" y1="754" x2="1545" y2="754" stroke="#000000" stroke-width="2"/>
<text x="60" y="783" text-anchor="start" font-size="19" font-weight="400" fill="#000000">甲醇与三氯化铁仅列投加接口；消毒剂采用次氯酸钠，有效氯是剂量计量指标。</text>
